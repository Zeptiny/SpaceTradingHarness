<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Deck · SpaceTradingHarness</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23f7a531' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23f7a531'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><circle cx="16" cy="16" r="4.5"/><path d="M16 1v5M16 26v5M1 16h5M26 16h5"/></svg>
      <div>
        <div class="brand-name">Flight Deck</div>
        <div class="brand-sub" id="agentIdent">SpaceTradingHarness</div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Views"></nav>
    <div class="rail-foot">
      <div class="link" id="link"><span class="link-dot"></span><span id="linkText">connecting…</span></div>
      <div class="rail-meta" id="railMeta"></div>
    </div>
  </aside>

  <div class="main">
    <header class="strip" id="strip">
      <div class="strip-status">
        <span class="beacon" id="beacon" aria-hidden="true"></span>
        <div>
          <div class="status-title" id="statusTitle">Connecting</div>
          <div class="status-sub" id="statusSub">waiting for harness…</div>
        </div>
      </div>
      <div class="strip-figures">
        <div class="figure">
          <span class="figure-label">Credits</span>
          <span class="figure-value" id="stripCredits">–</span>
          <span class="figure-delta" id="stripDelta"></span>
        </div>
        <div class="figure">
          <span class="figure-label">API budget</span>
          <span class="meter" id="rateMeter"><i></i></span>
          <span class="figure-small" id="rateText">–</span>
        </div>
        <div class="figure hide-md">
          <span class="figure-label">LLM tokens</span>
          <span class="figure-small" id="stripTokens">–</span>
        </div>
      </div>
      <div class="strip-controls">
        <button class="btn" id="btnWake" title="Run a wake now (works while paused)">Wake now</button>
        <button class="btn btn-toggle" id="btnPause">Pause</button>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="tooltip" id="tooltip" role="status" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
